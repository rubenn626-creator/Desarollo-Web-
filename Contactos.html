<!DOCTYPE html>
<html lang="es">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <!-- Cambie el título: es el texto de la pestaña del navegador
       y el que aparece en los resultados de búsqueda. -->
  <title>Contactos con Ruben</title>
  <meta name="description" content="Resumen del sitio en una sola línea.">

  <!-- La hoja de estilos se trabaja a partir de la sesión 3. -->
  <link rel="stylesheet" href="css/estilos.css">
</head>

<body>
  <header>
    <h1>Contactos con Ruben</h1>
    <nav>
      <a href="index.html">Inicio</a>
      <a href="Contactos.html">Contactos</a>
      <a href="Perfil.html">Perfil</a>
    </nav>
  </header>

  <main>
    <section>
      <h2>Contactos</h2>
      <p>Formulario de contactos</p>
    </section>

    <form id="contacto" novalidate>
      <div>
        <label for="nombre">Nombre</label>
        <input type="text" id="nombre" name="nombre">
        <p class="error" id="error-nombre"></p>
      </div>

      <div>
        <label for="correo">Correo</label>
        <input type="email" id="correo" name="correo">
        <p class="error" id="error-correo"></p>
      </div>

      <div>
        <label for="mensaje">Mensaje</label>
        <textarea id="mensaje" name="mensaje" rows="5"></textarea>
        <p class="error" id="error-mensaje"></p>
      </div>

      <button type="submit">Enviar</button>
    </form>


  </main>

  <footer>
    <p>2026 Ruben</p>
  </footer>

  <script src="js/scripts.js"></script>
</body>

</html>
